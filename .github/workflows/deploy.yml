# Push lên main → chạy test → dựng dist/ → đưa lên Cloudflare Pages (project "tuvithienluong",
# tên miền tuvithienluong.vn). Test hoặc build lỗi thì dừng, bản đang chạy không bị đụng tới.
# Cần 2 secret của repo: CLOUDFLARE_API_TOKEN (quyền Account · Cloudflare Pages · Edit)
# và CLOUDFLARE_ACCOUNT_ID. Gọi thẳng wrangler 4 (không dùng wrangler-action, vì action đó
# cài wrangler 3 và thu gọn mất thông báo lỗi trong log).
name: Deploy lên Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test bộ máy an sao
        run: node tests/engine.test.js

      - name: Test giao diện
        run: node tests/ui.test.js

      - name: Dựng dist/
        run: node tools/build.js
        env:
          SITE_URL: https://tuvithienluong.vn

      - name: Đưa lên Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=tuvithienluong --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
