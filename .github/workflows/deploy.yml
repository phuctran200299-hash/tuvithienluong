# Push lên main → chạy test → dựng dist/ → đưa lên Cloudflare Pages (project "tuvithienluong",
# tên miền tuvithienluong.vn). Test hoặc build lỗi thì dừng, bản đang chạy không bị đụng tới.
#
# Secret cần: CLOUDFLARE_API_TOKEN (quyền Account · Cloudflare Pages · Edit).
# CLOUDFLARE_ACCOUNT_ID KHÔNG còn bắt buộc: bước "Xác định tài khoản" hỏi thẳng API xem token
# thuộc tài khoản nào. Trước đây secret đó bị dán sai giá trị, wrangler chỉ báo cộc lốc
# "code 7003 — could not route", và bốn lần deploy liên tiếp đều chết ở đó mà không ai biết vì sao.
# Chỉ khi token nhìn thấy nhiều hơn một tài khoản thì mới cần secret để chọn.
#
# Gọi thẳng wrangler 4 (không dùng wrangler-action, vì action đó cài wrangler 3 và thu gọn
# mất thông báo lỗi trong log).
name: Deploy lên Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PAGES_PROJECT: tuvithienluong
  SITE_HOST: tuvithienluong.vn

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test bộ máy an sao
        run: node tests/engine.test.js

      - name: Test giao diện
        run: node tests/ui.test.js

      - name: Dựng dist/
        run: node tools/build.js
        env:
          SITE_URL: https://tuvithienluong.vn

      # Lấy account id từ chính token, rồi che nó khỏi log. Không in giá trị secret nào.
      - name: Xác định tài khoản Cloudflare
        id: cf
        run: |
          ds=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts")
          if [ "$(echo "$ds" | jq -r '.success')" != "true" ]; then
            echo "CLOUDFLARE_API_TOKEN không gọi được /accounts:"
            echo "$ds" | jq -r '.errors[]? | "  code \(.code): \(.message)"'
            echo "Tạo lại token: dash.cloudflare.com -> My Profile -> API Tokens -> Create Token,"
            echo "quyền Account · Cloudflare Pages · Edit. Rồi: gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          # Token hết hạn giữa chừng cũng làm deploy đỏ — nhắc trước 14 ngày.
          tk=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          het=$(echo "$tk" | jq -r '.result.expires_on // empty')
          if [ -n "$het" ]; then
            con=$(( ( $(date -u -d "$het" +%s) - $(date -u +%s) ) / 86400 ))
            echo "Token hết hạn ngày $het (còn $con ngày)."
            if [ "$con" -lt 14 ]; then
              echo "::warning title=Token Cloudflare sắp hết hạn::Còn $con ngày. Tạo token mới (Account · Cloudflare Pages · Edit) rồi chạy: gh secret set CLOUDFLARE_API_TOKEN"
            fi
          else
            echo "Token không đặt ngày hết hạn."
          fi
          so=$(echo "$ds" | jq -r '.result | length')
          echo "Token nhìn thấy $so tài khoản."
          if [ "$so" = "0" ]; then
            echo "Token không gắn với tài khoản nào — tạo lại token ở đúng tài khoản chứa project Pages."
            exit 1
          elif [ "$so" = "1" ]; then
            id=$(echo "$ds" | jq -r '.result[0].id')
          else
            id=$(echo "$ds" | jq -r --arg id "$CLOUDFLARE_ACCOUNT_ID" \
              '.result[] | select(.id == $id) | .id')
            if [ -z "$id" ]; then
              echo "Token thấy nhiều tài khoản nhưng CLOUDFLARE_ACCOUNT_ID không khớp cái nào."
              echo "Các tài khoản token thấy:"
              echo "$ds" | jq -r '.result[].name | "  - " + .'
              echo "Đặt lại: gh secret set CLOUDFLARE_ACCOUNT_ID"
              exit 1
            fi
          fi
          echo "::add-mask::$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Dừng sớm nếu chưa có project Pages, thay vì để wrangler báo lỗi khó hiểu.
      - name: Soát project Pages
        run: |
          ds=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
          if [ "$(echo "$ds" | jq -r '.success')" != "true" ]; then
            echo "Không đọc được danh sách project Pages:"
            echo "$ds" | jq -r '.errors[]? | "  code \(.code): \(.message)"'
            echo "Thường là token thiếu quyền Account · Cloudflare Pages · Edit."
            exit 1
          fi
          echo "Project Pages trong tài khoản:"
          echo "$ds" | jq -r '.result[].name | "  - " + .'
          echo "$ds" | jq -e --arg p "$PAGES_PROJECT" '.result[] | select(.name == $p)' > /dev/null || {
            echo "Không có project tên '$PAGES_PROJECT'. Tạo project Pages (Direct Upload) tên đó,"
            echo "hoặc sửa biến PAGES_PROJECT ở đầu workflow cho khớp một tên bên trên."
            exit 1
          }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.id }}

      - name: Đưa lên Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.id }}

      # Gỡ một trang khỏi dist/ thôi là chưa đủ: bản cũ còn nằm trong cache biên của
      # Cloudflare và vẫn mở được ở đường dẫn sạch. Xoá cache cho chắc. Bước này chỉ
      # CẢNH BÁO nếu token không đủ quyền — bản vừa đẩy lên đã đúng rồi, không việc gì
      # phải đánh đỏ cả lần deploy.
      - name: Xoá cache biên
        continue-on-error: true
        run: |
          z=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$SITE_HOST")
          zid=$(echo "$z" | jq -r '.result[0].id // empty')
          if [ -z "$zid" ]; then
            echo "::warning title=Chưa xoá được cache::Token không đọc được zone $SITE_HOST (cần quyền Zone · Zone · Read + Zone · Cache Purge · Purge). Nếu vừa gỡ trang nào, vào dash.cloudflare.com -> $SITE_HOST -> Caching -> Purge Everything."
            exit 0
          fi
          kq=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$zid/purge_cache")
          if [ "$(echo "$kq" | jq -r '.success')" = "true" ]; then
            echo "Đã xoá cache biên của $SITE_HOST."
          else
            echo "$kq" | jq -r '.errors[]? | "  code \(.code): \(.message)"'
            echo "::warning title=Chưa xoá được cache::Thêm quyền Zone · Cache Purge · Purge cho token, hoặc Purge Everything bằng tay trên dashboard."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
